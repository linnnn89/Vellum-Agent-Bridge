[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vellum-wpf-bridge"
version = "0.2.0"
description = "Vellum design documents to Semantic UI Spec and WPF/XAML bridge"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
vellum-wpf = "vellum_wpf_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
