<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#202023">
  <meta name="description" content="Vellum — a local-first, WebGPU-powered design editor. Plain HTML, CSS and JavaScript.">
  <title>Vellum — a little more possible.</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%238b6cff'/%3E%3Cpath d='m9 11 10 20 12-20h-7l-5 10-5-10z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand-section">
      <button class="brand" id="main-menu" aria-label="Vellum menu" title="Vellum menu" data-i18n-aria="topbar.brandAria" data-i18n-title="topbar.brandAria"><svg width="23" height="23" viewBox="0 0 32 32"><path d="M4 7h7l5 11 5-11h7L17 28h-3Z" fill="currentColor"/></svg><span>vellum</span><span class="brand-chevron">⌄</span></button>
      <div class="top-divider"></div>
      <button class="icon-button" id="toggle-left" title="Toggle layers panel" aria-label="Toggle layers panel" data-i18n-title="topbar.toggleLayers" data-i18n-aria="topbar.toggleLayers" data-icon="panel"></button>
    </div>
    <div class="file-breadcrumb"><span class="muted" data-i18n="topbar.workspace">Workspace</span><span class="crumb-slash">/</span><button id="file-name" title="Rename document" data-i18n-title="topbar.renameDoc">Forma · Product design</button><span class="file-chevron">⌄</span><span class="save-indicator" id="save-indicator"><i></i> <span data-i18n="topbar.savedLocally">Saved locally</span></span></div>
    <div class="top-actions"><button class="lang-toggle-btn" id="lang-toggle" title="切换界面语言 / Switch language"><span id="lang-btn-text">中 / EN</span></button><span class="local-badge" data-i18n="topbar.localFile">LOCAL FILE</span><button class="avatar" id="profile" title="Local-first · no account required" data-i18n-title="topbar.profileTip">Y</button><button class="icon-button" id="present" title="Present frames" aria-label="Present frames" data-i18n-title="topbar.present" data-i18n-aria="topbar.present" data-icon="play"></button><button class="share-button" id="share" title="Save a portable Vellum file"><span data-i18n="topbar.exportBtn">Export</span> <span data-icon="arrowUpRight"></span></button></div>
  </header>
  <main class="workspace">
    <aside class="left-panel" id="left-panel" aria-label="Pages and layers">
      <div class="left-heading"><span data-i18n="leftPanel.designFile">Design file</span><button class="icon-button small" id="search-button" title="Search layers" aria-label="Search layers" data-i18n-title="leftPanel.searchLayersTitle" data-i18n-aria="leftPanel.searchLayersTitle" data-icon="search"></button></div>
      <div class="left-tabs"><button class="active" data-left-tab="layers" data-i18n="leftPanel.tabLayers">Layers</button><button data-left-tab="assets" data-i18n="leftPanel.tabAssets">Assets</button><button class="icon-button small" id="collapse-all" title="Collapse layers" aria-label="Collapse layers" data-i18n-title="leftPanel.collapseAll" data-i18n-aria="leftPanel.collapseAll" data-icon="collapse"></button></div>
      <div class="layer-search hidden" id="layer-search"><span data-icon="search"></span><input id="search-layers" placeholder="Find a layer…" aria-label="Find a layer" data-i18n-placeholder="leftPanel.searchPlaceholder" data-i18n-aria="leftPanel.searchPlaceholder"></div>
      <div class="pages-heading"><span data-i18n="leftPanel.pagesHeading">Pages</span><button class="icon-button small" id="add-page" title="Add page" aria-label="Add page" data-i18n-title="leftPanel.addPage" data-i18n-aria="leftPanel.addPage" data-icon="plus"></button></div>
      <div id="page-list" class="page-list"></div>
      <div class="layers-heading"><span id="tree-heading" data-i18n="leftPanel.layersHeading">Layers</span><span class="muted" id="layer-count"></span></div>
      <div id="layer-tree" class="layer-tree" role="tree" aria-label="Layers"></div>
      <div id="assets-panel" class="assets-panel hidden"></div>
      <div class="left-footer"><div class="engine-dot"></div><span id="engine-label" data-i18n="leftPanel.startingRenderer">Starting renderer</span><button class="icon-button small" id="settings" title="Editor settings" aria-label="Editor settings" data-i18n-title="leftPanel.settingsBtn" data-i18n-aria="leftPanel.settingsBtn" data-icon="sliders"></button></div>
    </aside>
    <section class="canvas-area" id="canvas-area" aria-label="Design canvas">
      <div class="canvas-world" id="canvas-world"></div>
      <canvas id="scene" aria-label="Editable design canvas"></canvas>
      <canvas id="overlay" tabindex="0" aria-label="Canvas interaction area"></canvas>
      <div class="canvas-topline"><span class="canvas-crumb" id="canvas-page-name" data-i18n="canvas.defaultPage">Design exploration</span><button class="canvas-pill" id="canvas-status"><i></i><span data-i18n="canvas.localBadgeTip">All changes stay on this device</span></button></div>
      <div id="text-editor" contenteditable="plaintext-only" class="text-editor hidden" role="textbox" aria-multiline="true" spellcheck="false"></div>
      <div class="canvas-footer"><span class="canvas-hint" id="canvas-hint" data-i18n="canvas.hint">Space to pan <span>·</span> ⌘ scroll to zoom <span>·</span> ? for shortcuts</span><span class="performance" id="performance"></span></div>
      <div class="floating-toolbar" id="toolbar" role="toolbar" aria-label="Design tools">
        <button class="tool active" data-tool="select" title="Move (V)" aria-label="Move" data-i18n-title="toolbar.select" data-i18n-aria="toolbar.select" data-icon="cursor"></button>
        <button class="tool" data-tool="frame" title="Frame (F)" aria-label="Frame" data-i18n-title="toolbar.frame" data-i18n-aria="toolbar.frame" data-icon="frame"></button>
        <div class="toolbar-divider"></div>
        <button class="tool" data-tool="rect" title="Rectangle (R)" aria-label="Rectangle" data-i18n-title="toolbar.rect" data-i18n-aria="toolbar.rect" data-icon="rect"></button>
        <button class="tool" data-tool="ellipse" title="Ellipse (O)" aria-label="Ellipse" data-i18n-title="toolbar.ellipse" data-i18n-aria="toolbar.ellipse" data-icon="ellipse"></button>
        <button class="tool" data-tool="line" title="Line (L)" aria-label="Line" data-i18n-title="toolbar.line" data-i18n-aria="toolbar.line" data-icon="line"></button>
        <button class="tool" data-tool="pen" title="Pen (P) · click points, Enter to finish" aria-label="Pen" data-i18n-title="toolbar.pen" data-i18n-aria="toolbar.pen" data-icon="pen"></button>
        <button class="tool" data-tool="text" title="Text (T)" aria-label="Text" data-i18n-title="toolbar.text" data-i18n-aria="toolbar.text" data-icon="text"></button>
        <div class="toolbar-divider"></div>
        <button class="tool" data-tool="hand" title="Hand (H)" aria-label="Hand" data-i18n-title="toolbar.hand" data-i18n-aria="toolbar.hand" data-icon="hand"></button>
        <button class="tool" id="insert-image" title="Place image (⇧⌘K)" aria-label="Place image" data-i18n-title="toolbar.insertImage" data-i18n-aria="toolbar.insertImage" data-icon="image"></button>
        <div class="toolbar-divider"></div>
        <button class="tool accent-tool" id="command-button" title="Commands (⌘K)" aria-label="Command palette" data-i18n-title="toolbar.commands" data-i18n-aria="toolbar.commands" data-icon="sparkles"></button>
      </div>
      <div class="zoom-controls"><button id="zoom-out" class="icon-button small" title="Zoom out" aria-label="Zoom out" data-i18n-title="canvas.zoomOut" data-i18n-aria="canvas.zoomOut" data-icon="minus"></button><button id="zoom-value" title="Zoom options" data-i18n-title="canvas.zoomOptions">100%</button><button id="zoom-in" class="icon-button small" title="Zoom in" aria-label="Zoom in" data-i18n-title="canvas.zoomIn" data-i18n-aria="canvas.zoomIn" data-icon="plus"></button></div>
      <div class="welcome-tip" id="welcome-tip"><div class="welcome-icon" data-icon="sparkles"></div><div><strong data-i18n="canvas.welcomeTitle">A little more possible.</strong><p data-i18n="canvas.welcomeText">Your next idea starts here. Everything is editable.</p></div><button class="icon-button small" id="dismiss-tip" title="Dismiss" aria-label="Dismiss" data-i18n-title="canvas.dismiss" data-i18n-aria="canvas.dismiss" data-icon="close"></button></div>
    </section>
    <aside class="right-panel" id="right-panel" aria-label="Properties inspector">
      <div class="inspector-tabs"><button class="active" data-inspector-tab="design" data-i18n="inspector.tabDesign">Design</button><button data-inspector-tab="prototype" data-i18n="inspector.tabPrototype">Prototype</button><button class="icon-button small" id="theme-toggle" title="Toggle light / dark theme" aria-label="Toggle theme" data-i18n-title="inspector.toggleTheme" data-i18n-aria="inspector.toggleTheme" data-icon="sun"></button></div>
      <div class="inspector-scroll" id="inspector"></div>
      <div class="inspector-footer"><span data-i18n="inspector.footerQuote">Made for your next big idea.</span><button class="icon-button small" id="help" title="Keyboard shortcuts" aria-label="Keyboard shortcuts" data-i18n-title="inspector.help" data-i18n-aria="inspector.help" data-icon="help"></button></div>
    </aside>
  </main>
  <div id="context-menu" class="context-menu hidden" role="menu"></div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <div id="modal-backdrop" class="modal-backdrop hidden"><section id="modal" class="modal" role="dialog" aria-modal="true" aria-label="Editor dialog"></section></div>
  <div id="presentation" class="presentation hidden"><div class="presentation-toolbar"><span>vellum <span class="muted">/ Preview</span></span><span id="presentation-title"></span><div><button id="prev-frame" class="icon-button" aria-label="Previous frame" data-icon="arrowLeft"></button><span id="presentation-count"></span><button id="next-frame" class="icon-button" aria-label="Next frame" data-icon="arrowRight"></button><button id="close-presentation" class="icon-button" aria-label="Close preview" data-icon="close"></button></div></div><div class="presentation-stage" id="presentation-stage"><canvas id="presentation-canvas"></canvas></div></div>
  <input type="file" id="file-input" accept=".vellum,.json,application/json" hidden>
  <input type="file" id="image-input" accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml" hidden>
  <script type="module" src="src/app.js"></script>
</body>
</html>
